# RandomSPAWNZ Configuration

# If true, the plugin will only use worlds specified in the 'allowed-worlds' list
use-custom-worlds: false

# List of worlds where random spawns can occur (only used if use-custom-worlds is true)
allowed-worlds:
  - world
  - world_nether
  - world_the_end

# The range in which players will be randomly spawned
spawn-range:
  min-x: -1000
  max-x: 1000
  min-z: -1000
  max-z: 1000

# Maximum number of attempts to find a safe location
max-teleport-attempts: 50

# If true, will only teleport players to safe locations (not in lava, water, etc.)
safe-teleport: true

# If true, will only teleport players on their first join to the server
teleport-on-first-join-only: false

# If true, will send a welcome message to the player after teleporting
send-welcome-message: true

# The welcome message to send to players (supports color codes with &)
welcome-message: "&6Welcome to the server! &aYou've been randomly spawned!"