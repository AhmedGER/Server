#Minecraft server properties
#Optimized for PlayIt Tunnel - Low Latency Configuration
#Mon Oct 13 2025

# ═══════════════════════════════════════════════════════════
# إعدادات الاتصال والشبكة (Network Settings)
# ═══════════════════════════════════════════════════════════
server-ip=
server-port=25565
enable-status=true
online-mode=false
prevent-proxy-connections=false

# تحسين الشبكة - مهم لـ PlayIt
network-compression-threshold=256
max-tick-time=60000
rate-limit=0
use-native-transport=true
enable-query=false
query.port=25565

# ═══════════════════════════════════════════════════════════
# إعدادات اللاعبين (Player Settings)
# ═══════════════════════════════════════════════════════════
max-players=20
white-list=false
enforce-whitelist=false
allow-flight=false
player-idle-timeout=0

# ═══════════════════════════════════════════════════════════
# إعدادات العالم (World Settings)
# ═══════════════════════════════════════════════════════════
level-name=world
level-type=minecraft\:normal
level-seed=
generator-settings={}
generate-structures=true
max-world-size=29999984
allow-nether=true
max-build-height=256

# ═══════════════════════════════════════════════════════════
# إعدادات العرض والأداء (Performance & View Settings)
# ═══════════════════════════════════════════════════════════
# أهم إعدادات لتقليل الـ Lag
view-distance=4
simulation-distance=3
entity-broadcast-range-percentage=100
sync-chunk-writes=false

# ═══════════════════════════════════════════════════════════
# إعدادات Spawn (Spawn Settings)
# ═══════════════════════════════════════════════════════════
spawn-protection=16
spawn-npcs=true
spawn-animals=true
spawn-monsters=true
max-chained-neighbor-updates=1000000

# ═══════════════════════════════════════════════════════════
# إعدادات اللعبة (Game Settings)
# ═══════════════════════════════════════════════════════════
gamemode=survival
difficulty=normal
hardcore=false
pvp=true
force-gamemode=false
enable-command-block=false

# ═══════════════════════════════════════════════════════════
# صلاحيات (Permissions)
# ═══════════════════════════════════════════════════════════
op-permission-level=4
function-permission-level=2
broadcast-console-to-ops=true

# ═══════════════════════════════════════════════════════════
# Resource Pack
# ═══════════════════════════════════════════════════════════
resource-pack=
resource-pack-prompt=
resource-pack-sha1=
require-resource-pack=false

# ═══════════════════════════════════════════════════════════
# RCON (Remote Console) - معطل للأمان
# ═══════════════════════════════════════════════════════════
enable-rcon=true
rcon.port=25575
rcon.password=

# ═══════════════════════════════════════════════════════════
# رسائل السيرفر (Server Messages)
# ═══════════════════════════════════════════════════════════
motd=§2§kfghhh§4S§2I§3G§5M§9A §6's §8S§7e§1r§4v§3e§5r§4§ktbdtb                    §2 §l مرحبا بكم
        
server-name=SIGMA Server

# ═══════════════════════════════════════════════════════════
# إعدادات إضافية (Additional Settings)
# ═══════════════════════════════════════════════════════════
enable-jmx-monitoring=false
snooper-enabled=false
hide-online-players=false
previews-chat=false
text-filtering-config=
log-ips=true
initial-enabled-packs=vanilla
initial-disabled-packs=

# ═══════════════════════════════════════════════════════════
# Redstone & Updates
# ═══════════════════════════════════════════════════════════
broadcast-rcon-to-ops=true

# ═══════════════════════════════════════════════════════════
# تحسينات خاصة بـ PlayIt Tunnel
# ═══════════════════════════════════════════════════════════
# network-compression-threshold=256 ← يضغط البيانات فوق 256 بايت
# sync-chunk-writes=false ← يسرع حفظ الـ chunks
# view-distance=8 ← يقلل البيانات المرسلة
# simulation-distance=6 ← يقلل العمليات الحسابية
# rate-limit=0 ← يشيل حدود الاتصال
