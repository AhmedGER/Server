name: download-world
on:
  workflow_dispatch:

jobs:
  upload-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check and Prepare World Files
        run: |
          echo "=== Checking for world files ==="
          
          if [ -d "world" ]; then
            echo "✔ World folder found"
            echo "📦 Zipping world folder..."
            zip -r world-backup.zip world/
            
            SIZE=$(du -h world-backup.zip | cut -f1)
            echo "📊 World backup size: $SIZE"
          else
            echo "⚠️ No world folder found!"
            echo "Creating empty file for demonstration..."
            echo "No world data available" > no-world.txt
          fi
          
          # Optional: zip other dimensions if they exist
          if [ -d "world_nether" ]; then
            echo "📦 Zipping world_nether..."
            zip -r world_nether-backup.zip world_nether/
          fi
          
          if [ -d "world_the_end" ]; then
            echo "📦 Zipping world_the_end..."
            zip -r world_the_end-backup.zip world_the_end/
          fi
          
          echo "✔ World files prepared for download"

      - name: Upload World as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-world-backup-${{ github.run_number }}
          path: |
            world-backup.zip
            world_nether-backup.zip
            world_the_end-backup.zip
            no-world.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Show Download Instructions
        run: |
          echo ""
          echo "========================================"
          echo "✅ World uploaded successfully!"
          echo "========================================"
          echo ""
          echo "📥 To download:"
          echo "1. Go to the 'Summary' tab of this workflow run"
          echo "2. Scroll down to 'Artifacts' section"
          echo "3. Click on 'minecraft-world-backup-${{ github.run_number }}' to download"
          echo ""
          echo "⏰ Artifact will be available for 7 days"
          echo "========================================"
