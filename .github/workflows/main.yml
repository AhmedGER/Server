name: Minecraft 15min Run (main.yml – 2 steps claim URL + long run)

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 16
        uses: actions/setup-java@v3
        with:
            distribution: 'temurin'
            java-version: '16'

      - name: Download Paper 1.16.5
        run: |
          curl -L -o server.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar

      - name: Download playit binary
        run: |
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          file playit | grep -q ELF || (echo "Download failed (got HTML)" && exit 1)

      - name: Step 1 – Print claim URL (30s only)
        run: |
          echo ">>> 1. Copy this URL and open it:"
          echo "    https://playit.gg"
          echo ">>> 2. Click 'Add Agent' and copy the claim code"
          echo ">>> 3. Paste the code in the next step"
          timeout 600 ./playit || true   # 30 ثانية فقط → يظهر الـ URL
          echo "✔ Step 1 done (URL shown)."

      - name: Step 2 – Claim + run both (15min) + gentle stop
        run: |
          # ندخل الـ claim code مباشرة
          ./playit --claim YOUR_CODE_HERE > playit.log 2>&1 &
          PLAYIT_PID=$!
          echo "✔ Playit agent started (PID $PLAYIT_PID)"

          sleep 3   # يفتح الـ tunnels

          java -Xmx16G -Xms16G \
          -XX:+UseG1GC \
          -XX:+ParallelRefProcEnabled \
          -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions \
          -XX:+DisableExplicitGC \
          -XX:G1NewSizePercent=30 \
          -XX:G1MaxNewSizePercent=40 \
          -XX:G1HeapRegionSize=8M \
          -XX:G1ReservePercent=20 \
          -XX:G1HeapWastePercent=5 \
          -jar server.jar --nogui &
          SERVER_PID=$!
          echo "✔ Server started (PID $SERVER_PID)"

          sleep 900          # 15 دقيقة كاملة

          echo "Stopping server..."
          kill -TERM $SERVER_PID
          wait $SERVER_PID || true

          echo "Stopping playit..."
          kill $PLAYIT_PID
          wait $PLAYIT_PID || true

          cp ~/.playit.toml playit.toml 2>/dev/null || true
          echo "✔ 15min done (both stopped gently)."

      - name: Save only if changed (world+plugins)
        id: changed
        run: |
          git add world/ plugins/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push (if changed)
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git commit -m "Auto-save world+plugins $(date -u)" || exit 0
          git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push

      - name: Save playit.toml to repo (final step)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playit.toml
          git commit -m "Add playit.toml (15min run)" || exit 0
          git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push

      - name: Retrigger if alone
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list --workflow=main.yml --json status -q '.[] | select(.status=="queued" or .status=="in_progress") | .status' | wc -l)
          if [ "$runs" -le 1 ]; then
            gh workflow run main.yml
          fi
