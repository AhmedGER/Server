name: Minecraft 5min Test (repo playit + save-if-changed)

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo (with tools/playit & world+plugins)
        uses: actions/checkout@v4

      - name: Set up Java 16
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Download Paper 1.16.5
        run: |
          curl -L -o server.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar

      - name: First-time claim (run once only)
        if: hashFiles('playit.toml') == ''
        run: |
          echo ">>> Go to https://playit.gg, Add Agent, copy code, then paste here:"
          ./tools/playit
          cp ~/.playit.toml playit.toml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add playit.toml
          git commit -m "Add playit config" && git push || true

      - name: Restore playit config
        run: |
          cp "$GITHUB_WORKSPACE/playit.toml" ~/.playit.toml
          chmod 600 ~/.playit.toml

      - name: Run playit (background)
        run: |
          cp "$GITHUB_WORKSPACE/tools/playit" ./playit
          chmod +x ./playit
          ./playit &
          PLAYIT_PID=$!
          echo $PLAYIT_PID > playit.pid
          sleep 5   # let it register tunnels

      - name: Run server 5min then graceful stop
        run: |
          java -Xmx16G -Xms16G \
          -XX:+UseG1GC \
          -XX:+ParallelRefProcEnabled \
          -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions \
          -XX:+DisableExplicitGC \
          -XX:G1NewSizePercent=30 \
          -XX:G1MaxNewSizePercent=40 \
          -XX:G1HeapRegionSize=8M \
          -XX:G1ReservePercent=20 \
          -XX:G1HeapWastePercent=5 \
          -jar server.jar --nogui &
          SERVER_PID=$!
          sleep 300          # 5 دقائق
          echo "Stopping server..."
          kill -TERM $SERVER_PID
          wait $SERVER_PID || true
          # stop playit gently
          kill $(cat playit.pid) 2>/dev/null || true
          wait $(cat playit.pid) 2>/dev/null || true

      - name: Save only if changed (content or size)
        id: changed
        run: |
          git add world/ plugins/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push (if changed)
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git commit -m "Auto-save world+plugins $(date -u)" || exit 0
          git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push

      - name: Retrigger if alone
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list --workflow=minecraft-5min-test-repo-playit.yml --json status -q '.[] | select(.status=="queued" or .status=="in_progress") | .status' | wc -l)
          if [ "$runs" -le 1 ]; then
            gh workflow run minecraft-5min-test-repo-playit.yml
          fi
