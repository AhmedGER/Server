name: PlayIt First Claim + Server (interactive)

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 16
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Download Paper 1.16.5
        run: |
          echo "=== Downloading Paper 1.16.5 ==="
          curl -L -o server.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar
          echo "✔ server.jar downloaded"

      - name: Install deps
        run: |
          echo "=== Installing dependencies ==="
          sudo apt-get update && sudo apt-get install -y libjemalloc-dev net-tools
          echo "✔ Dependencies installed"

      - name: First claim → show url → wait → then run server
        run: |
          echo "=== STEP 1: Download playit ==="
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          echo "✔ playit downloaded"

          echo "=== STEP 2: Start playit (first time) to get claim url ==="
          ./playit > playit.log 2>&1 &
          PLAYIT_PID=$!
          echo "✔ Agent started (PID: $PLAYIT_PID)"

          echo "=== STEP 3: Extract claim url ==="
          for i in {1..10}; do
            CLAIM_PATH=$(grep -oP 'https://playit\.gg/claim/\K[A-Za-z0-9-]+' playit.log | head -1)
            if [ -n "$CLAIM_PATH" ]; then
              CLAIM_URL="https://playit.gg/claim/$CLAIM_PATH"
              echo "======================================"
              echo "  🔗 GO CLAIM YOUR TUNNEL:"
              echo "  $CLAIM_URL"
              echo "======================================"
              break
            fi
            echo "Waiting for claim url... ($i/10)"
            sleep 3
          done

          if [ -z "$CLAIM_PATH" ]; then
            echo "❌ Claim url not found! playit.log:"
            cat playit.log
            kill -9 $PLAYIT_PID
            exit 1
          fi

          echo "=== STEP 4: Waiting 3 minutes for you to claim ==="
          sleep 180

          echo "=== STEP 5: Stop agent gently after claim ==="
          kill -TERM $PLAYIT_PID
          wait $PLAYIT_PID || true
          echo "✔ Agent stopped after claim"

          echo "=== STEP 6: Re-start agent with new config ==="
          ./playit --config ~/.playit.toml > tunnel.log 2>&1 &
          PLAYIT_PID=$!
          echo "✔ Agent re-started (PID: $PLAYIT_PID)"

          echo "=== STEP 7: Extract tunnel address ==="
          for i in {1..10}; do
            TUNNEL=$(grep -oP 'tcp://\K[^\s]+' tunnel.log | head -1)
            if [ -n "$TUNNEL" ]; then
              echo "======================================"
              echo "  ✅ SERVER ADDRESS (COPY TO MC):"
              echo "  $TUNNEL"
              echo "======================================"
              break
            fi
            echo "Waiting for tunnel... ($i/10)"
            sleep 3
          done

          if [ -z "$TUNNEL" ]; then
            echo "❌ Tunnel not detected! tunnel.log:"
            cat tunnel.log
            kill -9 $PLAYIT_PID
            exit 1
          fi

          echo "=== STEP 8: Check eula ==="
          [ -f eula.txt ] || echo "eula=true" > eula.txt
          echo "✔ eula=true ensured"

          echo "=== STEP 9: JVM tuning ==="
          export MALLOC_ARENA_MAX=2
          export MALLOC_MMAP_THRESHOLD_=131072
          export MALLOC_TRIM_THRESHOLD_=131072
          export MALLOC_TOP_PAD_=131072
          export MALLOC_TEMP_THRESHOLD_=0
          export MALLOC_ARENA_TESTRATE=4
          export LD_PRELOAD=$(dpkg -L libjemalloc-dev | grep '\.so$' | head -n1)
          echo "✔ JVM variables set"

          echo "=== STEP 10: Start Minecraft server ==="
          java -Xmx16G -Xms12G \
          -XX:+UseG1GC \
          -XX:+ParallelRefProcEnabled \
          -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions \
          -XX:+DisableExplicitGC \
          -XX:G1NewSizePercent=30 \
          -XX:G1MaxNewSizePercent=40 \
          -XX:G1HeapRegionSize=8M \
          -XX:G1ReservePercent=20 \
          -XX:G1HeapWastePercent=5 \
          -jar server.jar --nogui &
          SERVER_PID=$!
          echo "✔ Server started (PID: $SERVER_PID)"

          echo "=== STEP 11: Server and agent are running ==="
          echo "Agent PID: $PLAYIT_PID | Server PID: $SERVER_PID"
          echo "Waiting 5h30m (19800 sec)..."
          sleep 19800

          echo "=== STEP 12: Graceful stop server ==="
          kill -TERM $SERVER_PID
          wait $SERVER_PID || true
          echo "✔ Server stopped"

          echo "=== STEP 13: Stop agent ==="
          kill -TERM $PLAYIT_PID
          wait $PLAYIT_PID || true
          echo "✔ Agent stopped"

          echo "=== STEP 14: Save playit.toml ==="
          cp ~/.playit.toml playit.toml 2>/dev/null || true
          echo "✔ playit.toml saved"

      - name: Save world+plugins+toml if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add world/ plugins/ playit.toml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-save $(date -u)"
            git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push
          fi

      - name: Retrigger if alone
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --json status -q '.[] | select(.status=="queued" or .status=="in_progress") | .status' | wc -l)
          if [ "$runs" -le 1 ]; then
            gh workflow run "${{ github.workflow }}"
          fi
          
