name: Minecraft 5h30m Loop (print everything)

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 16
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Download Paper 1.16.5
        run: |
          curl -L -o server.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libjemalloc-dev net-tools

      - name: One-step claim → agent stays up → server → stop both
        env:
          PLAYIT_CODE: ${{ secrets.PLAYIT_CODE }}
        run: |
          echo "=== STEP 1: Download playit ==="
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit
          echo "✔ playit-linux-amd64 downloaded"

          echo "=== STEP 2: Claim and start agent ==="
          ./playit --claim "$PLAYIT_CODE" > playit.log 2>&1 &
          PLAYIT_PID=$!
          echo "✔ Agent started (PID: $PLAYIT_PID)"
          sleep 6

          echo "=== STEP 3: Extract tunnel address ==="
          TUNNEL=$(grep -oP 'tcp://\K[^\s]+' playit.log | head -1)
          if [ -z "$TUNNEL" ]; then
            echo "❌ Tunnel not found! playit.log content:"
            cat playit.log
            kill -9 $PLAYIT_PID
            exit 1
          fi
          echo "======================================"
          echo "  SERVER ADDRESS (copy to Minecraft):"
          echo "  $TUNNEL"
          echo "======================================"

          echo "=== STEP 4: Check eula ==="
          [ -f eula.txt ] || echo "eula=true" > eula.txt
          echo "✔ eula=true ensured"

          echo "=== STEP 5: JVM tuning ==="
          export MALLOC_ARENA_MAX=2
          export MALLOC_MMAP_THRESHOLD_=131072
          export MALLOC_TRIM_THRESHOLD_=131072
          export MALLOC_TOP_PAD_=131072
          export MALLOC_TEMP_THRESHOLD_=0
          export MALLOC_ARENA_TESTRATE=4
          export LD_PRELOAD=$(dpkg -L libjemalloc-dev | grep '\.so$' | head -n1)
          echo "✔ JVM variables set"

          echo "=== STEP 6: Start Minecraft server ==="
          java -Xmx16G -Xms12G \
          -XX:+UseG1GC \
          -XX:+ParallelRefProcEnabled \
          -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions \
          -XX:+DisableExplicitGC \
          -XX:G1NewSizePercent=30 \
          -XX:G1MaxNewSizePercent=40 \
          -XX:G1HeapRegionSize=8M \
          -XX:G1ReservePercent=20 \
          -XX:G1HeapWastePercent=5 \
          -jar server.jar --nogui &
          SERVER_PID=$!
          echo "✔ Server started (PID: $SERVER_PID)"

          echo "=== STEP 7: Waiting 5h30m (19800 sec) ==="
          sleep 600

          echo "=== STEP 8: Graceful stop server ==="
          kill -TERM $SERVER_PID
          wait $SERVER_PID || true
          echo "✔ Server stopped"

          echo "=== STEP 9: Stop agent ==="
          kill -TERM $PLAYIT_PID
          wait $PLAYIT_PID || true
          echo "✔ Agent stopped"

          echo "=== STEP 10: Save playit.toml ==="
          cp ~/.playit.toml playit.toml 2>/dev/null || true
          echo "✔ playit.toml saved"

      - name: Save world+plugins+toml if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add world/ plugins/ playit.toml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-save $(date -u)"
            git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push
          fi

      - name: Retrigger if alone
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --json status -q '.[] | select(.status=="queued" or .status=="in_progress") | .status' | wc -l)
          if [ "$runs" -le 1 ]; then
            gh workflow run "${{ github.workflow }}"
          fi
          
