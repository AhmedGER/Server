name: Minecraft 5h30m Loop (claim+tunnel+graceful stop)

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 16
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Download Paper 1.16.5
        run: |
          curl -L -o server.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar

      - name: Install libjemalloc
        run: sudo apt-get update && sudo apt-get install -y libjemalloc-dev

      - name: Claim & Tunnel (interactive) → then run server
        run: |
          # 1- نزل playit
          curl -L -o playit https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit

          # 2- نشغّله ونستنّى رابط الـ claim
          ./playit > playit.log 2>&1 &
          PLAYIT_PID=$!
          sleep 4
          CLAIM_URL=$(grep -oP 'https://playit\.gg/claim/\K[A-Za-z0-9-]+' playit.log | head -1 | xargs -I{} echo "https://playit.gg/claim/{}")

          # 3- نطبع الرابط ونوقف تنفيذ الـ workflow 3 دقايق علشان تكمل أنت
          echo "======================================"
          echo "  اذهب للرابط التالى واعمل Claim:"
          echo "  $CLAIM_URL"
          echo "======================================"
          echo "سأنتظر 3 دقائق (180 ثانية) ثم أكمل..."
          sleep 180

          # 4- بعد الانتظار نطفى الـ agent وناخد الـ toml الصحيح
          kill -TERM $PLAYIT_PID
          wait $PLAYIT_PID || true
          cp ~/.playit.toml playit.toml 2>/dev/null || true

          # 5- نعيد تشغيل الـ agent بالتكوين الجديد
          ./playit --config playit.toml > tunnel.log 2>&1 &
          PLAYIT_PID=$!
          echo "✔ Tunnel re-started (PID $PLAYIT_PID)"
          sleep 3

          # 6- JVM tuning
          export MALLOC_ARENA_MAX=2
          export MALLOC_MMAP_THRESHOLD_=131072
          export MALLOC_TRIM_THRESHOLD_=131072
          export MALLOC_TOP_PAD_=131072
          export MALLOC_TEMP_THRESHOLD_=0
          export MALLOC_ARENA_TESTRATE=4
          export LD_PRELOAD=$(dpkg -L libjemalloc-dev | grep '\.so$' | head -n1)

          # 7- نشتغل بالسيرفر
          java -Xmx16G -Xms12G \
          -XX:+UseG1GC \
          -XX:+ParallelRefProcEnabled \
          -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions \
          -XX:+DisableExplicitGC \
          -XX:G1NewSizePercent=30 \
          -XX:G1MaxNewSizePercent=40 \
          -XX:G1HeapRegionSize=8M \
          -XX:G1ReservePercent=20 \
          -XX:G1HeapWastePercent=5 \
          -jar server.jar --nogui &
          SERVER_PID=$!
          echo "✔ Server started (PID $SERVER_PID)"

          # 8- نسيبهم يشتغلوا 5h30m
          sleep 600    # 5h30m

          # 9- إيقاف لطيف: السيرفر أولاً
          echo "Stopping server..."
          kill -TERM $SERVER_PID
          wait $SERVER_PID || true

          # 10- إيقاف الـ tunnel
          echo "Stopping tunnel..."
          kill -TERM $PLAYIT_PID
          wait $PLAYIT_PID || true

      - name: Save world+plugins+toml if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add world/ plugins/ playit.toml
          if ! git diff --cached --quiet; then
            git commit -m "Auto-save $(date -u)"
            git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push
          fi

      - name: Retrigger if alone
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --json status -q '.[] | select(.status=="queued" or .status=="in_progress") | .status' | wc -l)
          if [ "$runs" -le 1 ]; then
            gh workflow run "${{ github.workflow }}"
          fi
          
