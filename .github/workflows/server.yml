name: server
on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Paper 1.16.5
        run: |
          echo "=== Downloading Paper 1.16.5 ==="
          curl -L -o server.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar
          echo "✔ server.jar ready"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libjemalloc2 -qq
      - name: Setup Playit Tunnel
        run: |
          echo "=== Setting up Playit Tunnel ==="
          
          # Download playit agent
          wget -q https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit-linux-amd64
          
          # Create playit.toml from secret
          if [ -n "${{ secrets.PLAYIT_SECRET }}" ]; then
            echo "✔ Using PLAYIT_SECRET from GitHub Secrets"
            echo "${{ secrets.PLAYIT_SECRET }}" > playit.toml
          elif [ -f playit.toml ]; then
            echo "✔ Using existing playit.toml from repository"
          else
            echo "⚠️ WARNING: No PLAYIT_SECRET found and no playit.toml in repo!"
            echo "Please add PLAYIT_SECRET to GitHub Secrets or commit playit.toml"
            echo "Running playit without config (will need manual claim)..."
          fi
          
          # Start playit in background
          ./playit-linux-amd64 > playit.log 2>&1 &
          PLAYIT_PID=$!
          echo "Playit PID: $PLAYIT_PID"
          
          # Wait for playit to initialize
          sleep 15
          
          # Show playit logs
          echo "=== Playit Initialization Logs ==="
          cat playit.log || echo "No logs yet"
          echo "=================================="
          
          # Check if playit is running
          if ps -p $PLAYIT_PID > /dev/null; then
            echo "✔ Playit is running successfully"
          else
            echo "⚠️ Playit may have stopped, check logs above"
          fi
      - name: Run Minecraft Server
        run: |
          # Memory optimization
          export MALLOC_ARENA_MAX=2
          export MALLOC_MMAP_THRESHOLD_=131072
          export MALLOC_TRIM_THRESHOLD_=131072
          export MALLOC_TOP_PAD_=131072
          export MALLOC_TEMP_THRESHOLD_=0
          export MALLOC_ARENA_TESTRATE=4
          export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
          # Accept EULA
          test -f eula.txt || echo "eula=true" > eula.txt
          echo "=== Starting Minecraft Server ==="
          
          # Start the server process
          java -DPaper.IgnoreJavaVersion=true \
            -Xmx16G -Xms12G \
            -XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
            -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC \
            -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 \
            -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 \
            -XX:G1HeapWastePercent=5 \
            -jar server.jar --nogui &
          SERVER_PID=$!
          echo "✔ Minecraft Server started (PID: $SERVER_PID)"
          
          # ******************************************************
          # ** تنفيذ الأمر بعد دقيقتين (120 ثانية) - في نفس الخطوة **
          # ******************************************************
          {
            echo "⏰ Waiting 120 seconds for server to initialize..."
            sleep 120
            
            # إرسال الأمر 'op SIGMAxox' إلى مدخلات السيرفر (stdin)
            echo "op SIGMAxox"
            echo "✔ Command 'op SIGMAxox' sent to server console."
            
            # الانتظار للمدة المتبقية من تشغيل السيرفر (20700 - 120)
            echo "⏰ Server will run for 5 hours and 43 minutes more..."
            sleep 20580
            
            # إرسال أمر الإيقاف قبل الخروج
            echo "stop"
          } | while read LINE; do
            if [[ "$LINE" == *"⏰"* ]]; then
              echo "$LINE" # طباعة رسائلنا الزمنية
            else
              # إرسال الأوامر (op, stop) إلى السيرفر عبر الـ PID
              echo "$LINE" > /proc/$SERVER_PID/fd/0
            fi
          done
          
          
          echo ""
          echo "=== Playit Tunnel Info ==="
          cat playit.log | grep -i "connect\|tunnel\|claim\|error" || cat playit.log | tail -20
          echo "=========================="
          echo ""
          
          echo "⏰ Server has completed its run time."
          
          echo ""
          echo "=== Graceful Shutdown ==="
          kill -TERM $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          
          pkill -TERM playit-linux-amd64 2>/dev/null || true
          sleep 3
          
          echo "✔ Server and Playit stopped"
      - name: Save world and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all changes
          git add -A
          
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "Auto-save: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash \
              https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            echo "✔ Changes saved to repository"
          else
            echo "ℹ️ No changes to save"
          fi
      - name: Auto-retrigger workflow
        if: github.run_attempt < 3
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # Check if there are other running workflows
          runs=$(gh run list -w server.yml --json status -q \
               '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          
          if [ "$runs" -le 1 ]; then
            echo "No other workflows running, retriggering..."
            gh workflow run server.yml
            echo "✔ Workflow retriggered"
          else
            echo "Other workflows are running, skipping retrigger"
          fi
