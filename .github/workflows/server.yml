name: server
on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Paper 1.16.5
        run: |
          echo "=== Downloading Paper 1.16.5 ==="
          curl -L -o server.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar
          echo "✔ server.jar ready"

      - name: Setup Playit Tunnel with Auto-Restart
        run: |
          echo "=== Setting up Playit Tunnel with monitoring ==="
          
          chmod +x playit-linux-amd64
          
          if [ -n "${{ secrets.PLAYIT_SECRET }}" ]; then
            echo "${{ secrets.PLAYIT_SECRET }}" > playit.toml
            echo "✔ Playit configured from secrets"
          elif [ -f playit.toml ]; then
            echo "✔ Using existing playit.toml"
          else
            echo "⚠️ No playit config found"
          fi
          
          # تشغيل PlayIt مع إعادة تشغيل تلقائية
          while true; do
            ./playit-linux-amd64 >/dev/null 2>&1 || sleep 5
          done &
          
          echo "✔ Playit tunnel started with auto-restart"
          sleep 10

      - name: Run Minecraft Server
        run: |
          echo "=== Starting Minecraft Server ==="
          
          java -DPaper.IgnoreJavaVersion=true \
            -Xmx15360M -Xms10240M \
            -XX:+UseG1GC \
            -XX:+ParallelRefProcEnabled \
            -XX:MaxGCPauseMillis=200 \
            -XX:+UnlockExperimentalVMOptions \
            -XX:+DisableExplicitGC \
            -XX:+AlwaysPreTouch \
            -XX:G1NewSizePercent=30 \
            -XX:G1MaxNewSizePercent=40 \
            -XX:G1HeapRegionSize=16M \
            -XX:G1ReservePercent=20 \
            -XX:G1HeapWastePercent=5 \
            -XX:G1MixedGCCountTarget=4 \
            -XX:InitiatingHeapOccupancyPercent=15 \
            -XX:G1MixedGCLiveThresholdPercent=90 \
            -XX:G1RSetUpdatingPauseTimePercent=5 \
            -XX:SurvivorRatio=32 \
            -XX:+PerfDisableSharedMem \
            -XX:MaxTenuringThreshold=1 \
            -Dusing.aikars.flags=https://mcflags.emc.gs \
            -Daikars.new.flags=true \
            -jar server.jar --nogui &
          SERVER_PID=$!
          
          echo "✔ Minecraft Server started (PID: $SERVER_PID)"
          echo "⏰ Server will run for 5 hours 45 minutes..."
          
          # انتظار 3 دقائق للسيرفر يبدأ بالكامل
          echo "⏳ Waiting 3 minutes for server to fully start..."
          sleep 180
          
          # إضافة admin permissions وتحويل لـ creative
          echo "=== Setting up admin permissions ==="
          
          RCON_PASSWORD="ahmedger1"
          RCON_PORT="25575"
          
          # تحميل وتثبيت mcrcon
          wget -q https://github.com/Tiiffi/mcrcon/releases/download/v0.7.2/mcrcon-0.7.2-linux-x86-64.tar.gz
          tar -xzf mcrcon-0.7.2-linux-x86-64.tar.gz
          chmod +x mcrcon
          
          # تنفيذ الأوامر
          ./mcrcon -H localhost -P $RCON_PORT -p "$RCON_PASSWORD" "op SIGMAxox" >/dev/null 2>&1
          sleep 1
          ./mcrcon -H localhost -P $RCON_PORT -p "$RCON_PASSWORD" "gamemode creative SIGMAxox" >/dev/null 2>&1
          
          echo "✔ Admin permissions granted to $PLAYER_NAME"
          echo "✔ Gamemode set to Creative"
          
          echo ""
          echo "=== Server is now ONLINE ==="
          
          # Run for 5 hours 45 minutes (20700 seconds)
          sleep 20700
          
          echo ""
          echo "=== Stopping Server ==="
          
          # إيقاف السيرفر
          kill -TERM $SERVER_PID 2>/dev/null || true
          sleep 5
          kill -9 $SERVER_PID 2>/dev/null || true
          
          # إيقاف playit monitor و playit
          pkill -f "monitor_playit.sh" 2>/dev/null || true
          pkill -TERM playit-linux-amd64 2>/dev/null || true
          sleep 2
          pkill -9 playit-linux-amd64 2>/dev/null || true
          
          echo "✔ Server stopped"
          
          # عرض آخر سطور من playit monitor log
          if [ -f playit_monitor.log ]; then
            echo "=== PlayIt Monitor Log ==="
            tail -n 10 playit_monitor.log
          fi

      - name: Save world and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "Auto-save: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash \
              https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            echo "✔ Changes saved to repository"
          else
            echo "ℹ️ No changes to save"
          fi

      - name: Auto-retrigger workflow
        if: github.run_attempt < 3
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list -w server.yml --json status -q \
               '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          
          if [ "$runs" -le 1 ]; then
            echo "No other workflows running, retriggering..."
            gh workflow run server.yml
            echo "✔ Workflow retriggered"
          else
            echo "Other workflows are running, skipping retrigger"
          fi
