name: server

on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      # ---------- Java 21 (server runtime) ----------
      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # ---------- Java 16 (side install, optional) ----------
      - name: Add Java 16 side-by-side
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Download Paper 1.16.5
        run: |
          echo "=== Downloading Paper 1.16.5 (build 794) ==="
          curl -L -o server.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar
          echo "✔ server.jar ready"

      - name: Install deps
        run: |
          echo "=== Installing libjemalloc & net-tools ==="
          sudo apt-get update && sudo apt-get install -y libjemalloc-dev net-tools
          echo "✔ deps installed"

      - name: One-step server (Java 21) → 10 min → graceful stop
        run: |
          echo "=== STEP 1: JVM memory tuning ==="
          export MALLOC_ARENA_MAX=2
          export MALLOC_MMAP_THRESHOLD_=131072
          export MALLOC_TRIM_THRESHOLD_=131072
          export MALLOC_TOP_PAD_=131072
          export MALLOC_TEMP_THRESHOLD_=0
          export MALLOC_ARENA_TESTRATE=4
          export LD_PRELOAD=$(dpkg -L libjemalloc-dev | grep '\.so$' | head -n1)

          echo "=== STEP 2: Check / create eula ==="
          [ -f eula.txt ] || echo "eula=true" > eula.txt

          echo "=== STEP 3: Start server (Java 21) ==="
          $JAVA_HOME_21_X64/bin/java -Xmx16G -Xms12G \
            -XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
            -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC \
            -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 \
            -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 \
            -XX:G1HeapWastePercent=5 -jar server.jar --nogui &
          SERVER_PID=$!
          echo "✔ Server started (PID: $SERVER_PID)"

          echo "=== STEP 4 Java 16 availability check ==="
          $JAVA_HOME_16_X64/bin/java -version

          echo "=== STEP 5: Waiting 10 minutes (600 sec) ==="
          sleep 600   # غيّر إلى 19800 لاحقاً (5h30m)

          echo "=== STEP 6: Graceful stop ==="
          kill -TERM $SERVER_PID
          wait $SERVER_PID || true
          echo "✔ Server stopped"

      - name: Save world+plugins if changed
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add world/ plugins/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-save $(date -u)"
            git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push
          fi

      - name: Retrigger if alone
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list --workflow=server.yml --json status -q '.[] | select(.status=="queued" or .status=="in_progress") | .status' | wc -l)
          if [ "$runs" -le 1 ]; then
            gh workflow run server.yml
          fi
          
