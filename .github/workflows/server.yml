name: server
on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Paper 1.16.5
        run: |
          echo "=== Downloading Paper 1.16.5 (build 794) ==="
          curl -L -o server.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar
          echo "✔ server.jar ready"

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc2 net-tools

      - name: Setup Playit Tunnel
        run: |
          echo "=== Downloading Playit ==="
          wget -q https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit-linux-amd64
          
          echo "=== Checking if config already exists ==="
          if [ -f playit.toml ]; then
            echo "✔ Found existing playit.toml - tunnel will connect automatically"
          else
            echo "⚠ No playit.toml found - first time setup needed"
          fi
          
          echo "=== Starting Playit in background ==="
          ./playit-linux-amd64 > playit.log 2>&1 &
          PLAYIT_PID=$!
          echo "Playit PID: $PLAYIT_PID"
          
          echo "⏳ Waiting 30 seconds for playit to initialize..."
          sleep 30
          
          echo "================================"
          echo "=== PLAYIT INITIAL LOGS ==="
          echo "================================"
          cat playit.log || echo "No logs yet"
          echo "================================"
          
          echo ""
          echo "⏰ WAITING 6 MINUTES for tunnel setup!"
          echo "👆 If you see a claim URL above, open it NOW in your browser"
          echo "If tunnel is already claimed, it should connect automatically"
          echo ""
          
          for i in {1..6}; do
            echo "⏱ Minute $i/6 - Playit still running..."
            sleep 60
          done
          
          echo "================================"
          echo "=== PLAYIT COMPLETE LOGS ==="
          echo "================================"
          cat playit.log || echo "No logs"
          echo "================================"
          
          echo "=== Checking all created files ==="
          ls -lah
          echo ""
          find . -name "*playit*" -o -name "*.toml" 2>/dev/null || echo "No playit files found"
          
          echo "✔ Playit setup phase complete - keeping process running"

      - name: Run Minecraft Server with Playit
        run: |
          export MALLOC_ARENA_MAX=2
          export MALLOC_MMAP_THRESHOLD_=131072
          export MALLOC_TRIM_THRESHOLD_=131072
          export MALLOC_TOP_PAD_=131072
          export MALLOC_TEMP_THRESHOLD_=0
          export MALLOC_ARENA_TESTRATE=4
          export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2

          test -f eula.txt || echo "eula=true" > eula.txt
          
          echo "=== Checking Playit status ==="
          if ! pgrep -f playit-linux-amd64 > /dev/null; then
            echo "⚠ Playit not running, restarting it..."
            ./playit-linux-amd64 >> playit.log 2>&1 &
            PLAYIT_PID=$!
            echo "✔ Playit restarted (PID: $PLAYIT_PID)"
            sleep 10
          else
            echo "✔ Playit already running"
            PLAYIT_PID=$(pgrep -f playit-linux-amd64)
            echo "Playit PID: $PLAYIT_PID"
          fi
          
          echo "================================"
          echo "=== ALL PLAYIT LOGS BEFORE SERVER START ==="
          echo "================================"
          cat playit.log
          echo "================================"

          echo "=== Starting Minecraft Server ==="
          java -DPaper.IgnoreJavaVersion=true \
            -Xmx16G -Xms12G \
            -XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
            -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC \
            -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 \
            -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 \
            -XX:G1HeapWastePercent=5 \
            -jar server.jar --nogui &
          SERVER_PID=$!
          echo "✔ Server started (PID: $SERVER_PID)"

          echo "⏰ Server will run for 6 minutes..."
          sleep 360
          
          echo "=== Graceful shutdown ==="
          kill -TERM $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          echo "✔ Server stopped"
          
          echo "=== Stopping Playit ==="
          pkill -TERM playit-linux-amd64 2>/dev/null || true
          sleep 2
          echo "✔ Playit stopped"
          
          echo "================================"
          echo "=== FINAL PLAYIT LOGS ==="
          echo "================================"
          cat playit.log
          echo "================================"

      - name: Save all files to repository
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          
          echo "=== Listing ALL files including hidden ==="
          ls -lah
          
          echo "=== Finding ALL playit files ==="
          find . -type f -name "*playit*" -o -name "*.toml" 2>/dev/null || true
          find $HOME -type f -name "*playit*" -o -name "*.toml" 2>/dev/null ||
          
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "Auto-save all files $(date -u)"
            git pull --rebase --autostash \
              https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            echo "✔ All files saved to repository"
          else
            echo "ℹ No changes to save"
          fi

      - name: Retrigger if alone
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list -w server.yml --json status -q \
               '.[]|select(.status=="queued" or .status=="in_progress")|length')
          if [ "$runs" -le 1 ] && [ "${{ github.run_attempt }}" -lt 3 ]; then
            gh workflow run server.yml
          fi
