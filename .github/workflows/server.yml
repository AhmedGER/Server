name: server
on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Paper 1.16.5
        run: |
          curl -L -o server.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar

      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y libjemalloc2 net-tools

      - name: 2-min server test with graceful stop
        run: |
          export MALLOC_ARENA_MAX=2
          export MALLOC_MMAP_THRESHOLD_=131072
          export MALLOC_TRIM_THRESHOLD_=131072
          export MALLOC_TOP_PAD_=131072
          export MALLOC_TEMP_THRESHOLD_=0
          export MALLOC_ARENA_TESTRATE=4
          export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2

          [ -f eula.txt ] || echo eula=true > eula.txt

          PIPE=$(mktemp -u)
          mkfifo "$PIPE"

          java -DPaper.IgnoreJavaVersion=true \
            -Xmx4G -Xms2G \
            -XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
            -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC \
            -jar server.jar --nogui < "$PIPE" &
          SERVER_PID=$!

          sleep 120   # دقيقتين

          echo stop > "$PIPE"
          wait $SERVER_PID || true
          rm -f "$PIPE"

      - name: Save world+plugins if changed
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add world plugins || true
          if ! git diff --cached --quiet; then
            git commit -m "Auto-save $(date -u)"
            git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push
          fi

      - name: Retrigger if alone
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list -w server.yml --json status -q '.[]|select(.status=="queued" or .status=="in_progress")|length')
          if [ "$runs" -le 1 ]; then
            gh workflow run server.yml
          fi
