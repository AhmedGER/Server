name: server
on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Paper 1.16.5 and Setup World
        run: |
          echo "=== Downloading Paper 1.16.5 ==="
          curl -L -o server.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar
          echo "✔ server.jar ready"
          
          if [ -f world.zip ]; then
            echo "=== Extracting world.zip ==="
            unzip -q world.zip
            echo "✔ World extracted successfully"
          else
            echo "ℹ️ No world.zip found, using existing world"
          fi

      - name: Setup Playit Tunnel with Auto-Restart
        run: |
          echo "=== Setting up Playit Tunnel with monitoring ==="
          
          chmod +x playit-linux-amd64
          
          if [ -n "${{ secrets.PLAYIT_SECRET }}" ]; then
            echo "${{ secrets.PLAYIT_SECRET }}" > playit.toml
            echo "✔ Playit configured from secrets"
          elif [ -f playit.toml ]; then
            echo "✔ Using existing playit.toml"
          else
            echo "⚠️ No playit config found"
          fi
          
          while true; do
            ./playit-linux-amd64 >/dev/null 2>&1 || sleep 5
          done &
          
          echo "✔ Playit tunnel started with auto-restart"
          echo "ℹ️ Minecraft port (25565) and RCON port (25575) will be tunneled"
          sleep 10

      - name: Setup Ngrok Tunnel
        run: |
          echo "=== Setting up Ngrok Tunnel ==="
          
          # تحميل النسخة الصحيحة لـ Linux
          if [ ! -f ngrok-linux-amd64 ] || ! file ngrok-linux-amd64 | grep -q "ELF 64-bit"; then
            echo "⚠️ Downloading correct ngrok binary for Linux..."
            wget -q https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz
            tar -xzf ngrok-v3-stable-linux-amd64.tgz
            mv ngrok ngrok-linux-amd64
            rm ngrok-v3-stable-linux-amd64.tgz
            echo "✔ Ngrok downloaded"
          else
            echo "✔ Using existing ngrok binary"
          fi
          
          chmod +x ngrok-linux-amd64
          
          # إعداد Auth Token من Secrets
          ./ngrok-linux-amd64 config add-authtoken ${{ secrets.NGROK_AUTH }}
          echo "✔ Ngrok configured"
          
          # إنشاء config file
          mkdir -p ~/.config/ngrok
          cat > ~/.config/ngrok/ngrok.yml << 'EOF'
          version: "2"
          authtoken: ${{ secrets.NGROK_AUTH }}
          region: eu
          web_addr: localhost:4040
          tunnels:
            minecraft:
              proto: tcp
              addr: 25565
            rcon:
              proto: tcp
              addr: 25575
            dynmap:
              proto: http
              addr: 8123
          EOF
          
          # تشغيل Ngrok مع auto-restart
          while true; do
            pkill -9 ngrok-linux-amd64 2>/dev/null || true
            sleep 2
            ./ngrok-linux-amd64 start --all --log=stdout > ngrok.log 2>&1 &
            sleep 15
            
            # عرض معلومات الاتصال
            if curl -s http://localhost:4040/api/tunnels > /dev/null 2>&1; then
              TUNNELS_JSON=$(curl -s http://localhost:4040/api/tunnels)
              
              MINECRAFT_URL=$(echo $TUNNELS_JSON | grep -o '"name":"minecraft"[^}]*"public_url":"tcp://[^"]*' | grep -o 'tcp://[^"]*' | head -1)
              RCON_URL=$(echo $TUNNELS_JSON | grep -o '"name":"rcon"[^}]*"public_url":"tcp://[^"]*' | grep -o 'tcp://[^"]*' | head -1)
              DYNMAP_URL=$(echo $TUNNELS_JSON | grep -o '"name":"dynmap"[^}]*"public_url":"http[^"]*' | grep -o 'http[^"]*' | head -1)
              
              if [ ! -z "$MINECRAFT_URL" ]; then
                echo "════════════════════════════════════════════"
                echo "🎮 Ngrok Minecraft: $MINECRAFT_URL"
                echo "🎛️  Ngrok RCON: $RCON_URL"
                echo "🗺️  Ngrok Dynmap: $DYNMAP_URL"
                echo "════════════════════════════════════════════"
                break
              fi
            fi
            
            sleep 30
          done &
          
          echo "✔ Ngrok tunnel started"
          sleep 5

      - name: Run Minecraft Server
        run: |
          echo "=== Starting Minecraft Server ==="
          
          java -DPaper.IgnoreJavaVersion=true \
            -Xmx15360M -Xms10240M \
            -XX:+UseG1GC \
            -XX:+ParallelRefProcEnabled \
            -XX:MaxGCPauseMillis=200 \
            -XX:+UnlockExperimentalVMOptions \
            -XX:+DisableExplicitGC \
            -XX:+AlwaysPreTouch \
            -XX:G1NewSizePercent=30 \
            -XX:G1MaxNewSizePercent=40 \
            -XX:G1HeapRegionSize=16M \
            -XX:G1ReservePercent=20 \
            -XX:G1HeapWastePercent=5 \
            -XX:G1MixedGCCountTarget=4 \
            -XX:InitiatingHeapOccupancyPercent=15 \
            -XX:G1MixedGCLiveThresholdPercent=90 \
            -XX:G1RSetUpdatingPauseTimePercent=5 \
            -XX:SurvivorRatio=32 \
            -XX:+PerfDisableSharedMem \
            -XX:MaxTenuringThreshold=1 \
            -Dusing.aikars.flags=https://mcflags.emc.gs \
            -Daikars.new.flags=true \
            -jar server.jar --nogui &
          SERVER_PID=$!
          
          echo "✔ Minecraft Server started (PID: $SERVER_PID)"
          echo "⏰ Server will run for max 5 hours 45 minutes..."
          
          echo "⏳ Waiting 1 minute for server to fully start..."
          sleep 60
          
          echo ""
          echo "=== Server is now ONLINE ==="
          echo "ℹ️ Type 'stop' in-game to shutdown server immediately"
          
          MAX_TIME=20700
          ELAPSED=0
          CHECK_INTERVAL=10
          
          while [ $ELAPSED -lt $MAX_TIME ]; do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo ""
              echo "=== Server Stopped by User ==="
              echo "⏱️ Server ran for approximately $((ELAPSED / 60)) minutes"
              break
            fi
            
            sleep $CHECK_INTERVAL
            ELAPSED=$((ELAPSED + CHECK_INTERVAL))
            
            if [ $((ELAPSED % 1800)) -eq 0 ]; then
              echo "⏰ Server running... $((ELAPSED / 60)) minutes elapsed"
            fi
          done
          
          if kill -0 $SERVER_PID 2>/dev/null; then
            echo ""
            echo "=== Time Limit Reached - Stopping Server ==="
            kill -TERM $SERVER_PID 2>/dev/null || true
            sleep 5
            kill -9 $SERVER_PID 2>/dev/null || true
          fi
          
          # إيقاف PlayIt و Ngrok
          pkill -f "monitor_playit.sh" 2>/dev/null || true
          pkill -TERM playit-linux-amd64 2>/dev/null || true
          pkill -9 playit-linux-amd64 2>/dev/null || true
          pkill -9 ngrok-linux-amd64 2>/dev/null || true
          
          echo "✔ Server stopped"
          
          if [ -f playit_monitor.log ]; then
            echo "=== PlayIt Monitor Log ==="
            tail -n 10 playit_monitor.log
          fi

      - name: Save world and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "Auto-save: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash \
              https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            echo "✔ Changes saved to repository"
          else
            echo "ℹ️ No changes to save"
          fi

      - name: Auto-retrigger workflow
        if: github.run_attempt < 3
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list -w server.yml --json status -q \
               '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          
          if [ "$runs" -le 1 ]; then
            echo "No other workflows running, retriggering..."
            gh workflow run server.yml
            echo "✔ Workflow retriggered"
          else
            echo "Other workflows are running, skipping retrigger"
          fi
