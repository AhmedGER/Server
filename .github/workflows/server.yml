name: server
on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '21'

      - name: Download Paper 1.16.5
        run: |
          echo "=== Downloading Paper 1.16.5 ==="
          curl -L -o server.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar
          echo "✔ server.jar ready"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc2

      - name: Install & configure playit
        env:
          SECRET_KEY: ${{ secrets.PLAYIT_SECRET }}
        run: |
          # 1. تحميل وتثبيت أحدث deb
          curl -fsSL -o playit.deb \
            https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          sudo dpkg -i playit.deb || sudo apt-get -f install -y
          rm playit.deb

          # 2. claim (مرة واحدة فقط)
          if ! playit status | grep -q "claimed"; then
            echo "=== Claiming agent ==="
            playit claim
            sleep 3
          else
            echo "✔ Agent already claimed"
          fi

          # 3. إنشاء تونل TCP 25565 تلقائياً
          echo "=== Creating tunnel ==="
          playit setup --non-interactive \
            --tunnel-type tcp \
            --local-port 25565 \
            --tunnel-name minecraft-java

          # 4. تشغيل الخدمة
          sudo systemctl start playit
          sudo systemctl enable playit
          sleep 5
          systemctl status playit --no-pager

          # 5. طباعة العنوان الخارجي
          echo "=== External address ==="
          playit status | tee playit.log

      - name: Accept EULA & start server
        run: |
          test -f eula.txt || echo "eula=true" > eula.txt
          echo "=== Starting Minecraft Server ==="
          export MALLOC_ARENA_MAX=2
          export MALLOC_MMAP_THRESHOLD_=131072
          export MALLOC_TRIM_THRESHOLD_=131072
          export MALLOC_TOP_PAD_=131072
          export MALLOC_TEMP_THRESHOLD_=0
          export MALLOC_ARENA_TESTRATE=4
          export LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2

          java -DPaper.IgnoreJavaVersion=true \
            -Xmx16G -Xms12G \
            -XX:+UseG1GC -XX:MaxGCPauseMillis=200 \
            -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC \
            -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 \
            -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 \
            -XX:G1HeapWastePercent=5 \
            -jar server.jar --nogui &
          SERVER_PID=$!
          echo "✔ Server started (PID: $SERVER_PID)"

          echo "⏰ Server running for 5h 45m..."
          sleep 20700

          echo "=== Stopping ==="
          kill -TERM $SERVER_PID 2>/dev/null || true
          sudo systemctl stop playit
          wait $SERVER_PID 2>/dev/null || true
          echo "✔ Stopped"

      - name: Save files to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "Auto-save $(date -u)"
            git pull --rebase --autostash \
              https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            echo "✔ Saved"
          fi

      - name: Retrigger if needed
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list -w server.yml --json status -q \
               '.[]|select(.status=="queued" or .status=="in_progress")|length')
          if [ "$runs" -le 1 ] && [ "${{ github.run_attempt }}" -lt 3 ]; then
            gh workflow run server.yml
          fi
          
