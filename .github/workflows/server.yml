name: server
on:
  workflow_dispatch:

jobs:
  minecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download Paper 1.16.5
        run: |
          echo "=== Downloading Paper 1.16.5 ==="
          curl -L -o server.jar \
            https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar
          echo "✔ server.jar ready"

      - name: Download and Setup Playit Tunnel
        run: |
          echo "=== Downloading Playit ==="
          
          # تحميل playit
          wget -q https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64
          chmod +x playit-linux-amd64
          
          echo "✔ Playit downloaded"
          
          echo "=== Setting up Playit Tunnel ==="
          
          # إعداد playit من secrets أو ملف موجود
          if [ -n "${{ secrets.PLAYIT_SECRET }}" ]; then
            echo "${{ secrets.PLAYIT_SECRET }}" > playit.toml
            echo "✔ Playit configured from secrets"
          elif [ -f playit.toml ]; then
            echo "✔ Using existing playit.toml"
          else
            echo "⚠️ No playit config found - creating new setup"
            # هيطلب setup جديد
          fi
          
          # تشغيل playit في الخلفية
          ./playit-linux-amd64 > playit.log 2>&1 &
          PLAYIT_PID=$!
          echo "✔ Playit tunnel started (PID: $PLAYIT_PID)"
          
          # انتظار playit يتصل
          echo "⏳ Waiting for Playit to connect..."
          sleep 10
          
          # عرض معلومات الاتصال
          if [ -f playit.log ]; then
            echo "=== Playit Connection Info ==="
            cat playit.log | grep -E "https://|tunnel|address" || echo "Check playit.log for details"
          fi
          
          echo "✔ Playit tunnel active"

      - name: Run Minecraft Server
        run: |
          echo "=== Starting Minecraft Server ==="
          
          # قبول EULA
          echo "eula=true" > eula.txt
          
          java -DPaper.IgnoreJavaVersion=true \
            -Xmx13500M -Xms9600M \
            -XX:+UseG1GC \
            -XX:MaxGCPauseMillis=130 \
            -XX:+UnlockExperimentalVMOptions \
            -XX:+DisableExplicitGC \
            -XX:+AlwaysPreTouch \
            -XX:G1NewSizePercent=28 \
            -XX:G1MaxNewSizePercent=36 \
            -XX:G1HeapRegionSize=16M \
            -XX:G1ReservePercent=15 \
            -XX:G1HeapWastePercent=5 \
            -XX:G1MixedGCCountTarget=4 \
            -XX:InitiatingHeapOccupancyPercent=15 \
            -XX:G1RSetUpdatingPauseTimePercent=5 \
            -XX:MaxTenuringThreshold=1 \
            -jar server.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          
          echo "✔ Minecraft Server started (PID: $SERVER_PID)"
          
          # انتظار السيرفر يبدأ
          echo "⏳ Waiting for server to start..."
          sleep 30
          
          # عرض آخر سطور من log
          if [ -f server.log ]; then
            echo "=== Server Status ==="
            tail -n 20 server.log
          fi
          
          echo ""
          echo "⏰ Server will run for 5 hours 45 minutes..."
          echo "=== Server is now ONLINE ==="
          
          # Run for 5 hours 45 minutes (20700 seconds)
          # 5 hours = 18000 seconds
          # 45 minutes = 2700 seconds
          # Total = 20700 seconds
          sleep 20700
          
          echo ""
          echo "=== Stopping Server ==="
          kill -TERM $SERVER_PID 2>/dev/null || true
          sleep 5
          kill -9 $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          
          # إيقاف playit
          pkill -TERM playit-linux-amd64 2>/dev/null || true
          sleep 2
          pkill -9 playit-linux-amd64 2>/dev/null || true
          
          echo "✔ Server stopped"
          
          # عرض آخر سطور من logs
          echo "=== Final Server Log ==="
          tail -n 10 server.log 2>/dev/null || echo "No log file"

      - name: Save world and config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "Auto-save: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git pull --rebase --autostash \
              https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            git push https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository }}.git
            echo "✔ Changes saved to repository"
          else
            echo "ℹ️ No changes to save"
          fi

      - name: Auto-retrigger workflow
        if: github.run_attempt < 3
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list -w server.yml --json status -q \
               '[.[] | select(.status=="queued" or .status=="in_progress")] | length')
          
          if [ "$runs" -le 1 ]; then
            echo "No other workflows running, retriggering..."
            gh workflow run server.yml
            echo "✔ Workflow retriggered"
          else
            echo "Other workflows are running, skipping retrigger"
          fi
