name: Minecraft 5h30m Safe Loop

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 340      # 5.5h + هوامش

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 16
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '16'

      - name: Download Paper 1.16.5
        run: |
          curl -L -o server.jar \
          https://api.papermc.io/v2/projects/paper/versions/1.16.5/builds/794/downloads/paper-1.16.5-794.jar

      - name: Install performance libs & rcon
        run: |
          sudo apt-get update
          sudo apt-get install -y libjemalloc-dev rcon-cli

      - name: Enable rcon in server.properties
        run: |
          awk '
            /^enable-rcon=/ {$0 = "enable-rcon=true"}
            /^rcon.port=/  {$0 = "rcon.port=25575"}
            /^rcon.password=/{$0 = "rcon.password=secret123"}
            {print}' server.properties > server.properties.tmp && mv server.properties.tmp server.properties

      - name: Run server (background)
        run: |
          export MALLOC_ARENA_MAX=2
          export LD_PRELOAD=$(dpkg -L libjemalloc-dev | grep '\.so$' | head -n1)
          java -Xmx16G -Xms12G \
          -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 \
          -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC \
          -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 \
          -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 \
          -jar server.jar --nogui &
          echo $! > server.pid

      - name: Wait 5h 30min
        run: sleep 19800   # 5.5 ساعة بالثواني

      - name: Send "stop" via rcon (safe shutdown)
        run: rcon-cli -H 127.0.0.1 -P 25575 -p secret123 stop || true

      - name: Wait for server to exit
        run: |
          while kill -0 $(cat server.pid) 2>/dev/null; do sleep 2; done

      - name: Check real changes (size or new files)
        id: changed
        run: |
          git add world/ plugins/
          if git diff --staged --quiet && git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push (only if changed)
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git commit -m "Save $(date -u)"
          git pull --rebase --autostash https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push

      - name: Cooldown 10s
        run: sleep 10

      - name: Retrigger if no run queued
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          runs=$(gh run list --workflow=minecraft-5h30m-safe-loop.yml --json status -q '.[] | select(.status=="queued" or .status=="in_progress") | .status' | wc -l)
          if [ "$runs" -le 1 ]; then
            gh workflow run minecraft-5h30m-safe-loop.yml
          else
            echo "Another run active, skipping retrigger."
          fi
